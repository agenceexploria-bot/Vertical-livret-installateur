name: Déploiement Vercel (production)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - run: flutter pub get

      # Garde-fou avant déploiement : sans ça, un commit qui casse la
      # compilation ou fait régresser un test atteignait directement la
      # production (voir revue de sécurité/déploiement). Les tests backend
      # (vitest) ne sont pas inclus ici : ils tournent contre une vraie base
      # Neon et ont besoin de secrets non câblés dans ce workflow.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifie le typage TypeScript du backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit

      # Invalide le cache du service worker PWA à chaque déploiement (voir
      # web/pwa_cache_worker.js) en y injectant le SHA du commit — sans ça,
      # les visiteurs déjà passés sur le site peuvent continuer à voir une
      # version périmée de l'app indéfiniment.
      - name: Injecte le SHA du commit dans le cache PWA
        run: sed -i "s/const CACHE_VERSION = 'dev';/const CACHE_VERSION = '${{ github.sha }}';/" web/pwa_cache_worker.js

      - run: flutter build web --release

      - name: Déploiement Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel link --yes --token="$VERCEL_TOKEN" --scope explore-ia --project vertical-livret-installateur
          npx vercel --prod --yes --token="$VERCEL_TOKEN"
